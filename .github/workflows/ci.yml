name: ci

# What .githooks/pre-push runs, again on GitHub: a push that went round the
# hook (SKIP_HOOKS=1, --no-verify, a web edit, a PR from elsewhere) is still
# checked. Keep the two in step — checks.sh is the list.
#
#   astro check           types and content collections, blocking
#   astro build           to a temp dir; the build Cloudflare Pages runs
#   gitleaks              the pushed commits and the tree, as the hook does
#
# gitleaks here runs on its DEFAULT rules. The hook and the box deploy gate
# use foldrun-infra/.gitleaks.toml, which this private repo's workflow cannot
# read without a token we have chosen not to store; its allowlist only names
# old commits and fixtures elsewhere, so the default rules pass this tree. A
# finding here that the infra config allowlists is the cue to copy that entry
# into a .gitleaks.toml in this repo, not to drop the step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref on the single CI runner; a newer push cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub's hosted runner: this repository is public (25 Oct 2026), and a
    # public repository never runs on our own machines — a pull request from
    # a fork would run its code there. Hosted minutes are free for public
    # repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4" # Astro needs >= 22.23.4; "22" resolved to 22.23.3 on hosted runners
          cache: npm
      - run: npm ci
      - run: npx --no-install astro check
      - name: astro build (to a temp dir)
        # Inside the checkout, not $RUNNER_TEMP: in a container job the two are
        # different mounts, and astro moves its assets with rename(), which
        # cannot cross them (EXDEV on the CI runner, 20 Oct 2026).
        run: npx --no-install astro build --outDir "$GITHUB_WORKSPACE/.ci-build-out"

      # The version the deploy gate pins (foldrun-infra dev/ci/scan.sh), as
      # the release binary checked against its published sha256. The range is
      # what this push or PR adds; a new branch with no "before" gets the tree
      # scan alone.
      - name: install gitleaks 8.30.1
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gl="$RUNNER_TEMP/gitleaks"
          from=${BASE:-$BEFORE}
          if [ -n "$from" ] && [ "$from" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
            echo "== commits $from..$HEAD ($(git rev-list --count "$from..$HEAD"))"
            "$gl" git --log-opts="$from..$HEAD" --no-banner --redact=90 --exit-code 1 -v .
          fi
          echo "== tree at $HEAD"
          d=$(mktemp -d)
          git archive "$HEAD" | tar -x -C "$d"
          [ -n "$(ls -A "$d")" ] || { echo "the tree unpacked empty — nothing was scanned"; exit 1; }
          "$gl" dir "$d" --no-banner --redact=90 --exit-code 1 -v
